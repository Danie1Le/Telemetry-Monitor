# Creates the tables and topics in the emulators. DynamoDB Local is in-memory:
# if its pod restarts, re-run scripts/kind-up.sh (it recreates this Job).
apiVersion: batch/v1
kind: Job
metadata:
  name: init
spec:
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: init
          image: amazon/aws-cli:2.22.35
          imagePullPolicy: IfNotPresent
          command: [sh, /init/init.sh]
          env:
            - { name: DYNAMODB_ENDPOINT, value: http://dynamodb:8000 }
            - { name: SNS_ENDPOINT, value: http://moto:5000 }
            - { name: AWS_DEFAULT_REGION, value: us-west-2 }
          envFrom:
            - secretRef: { name: aws-credentials }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: script, mountPath: /init }
      volumes:
        # Created by scripts/kind-up.sh from local/init.sh.
        - name: script
          configMap: { name: init-script }
