apiVersion: apps/v1
kind: Deployment
metadata:
  name: processor
spec:
  selector:
    matchLabels: { app: processor }
  template:
    metadata:
      labels: { app: processor }
    spec:
      # A 20s long poll plus the batch in hand must finish after SIGTERM.
      terminationGracePeriodSeconds: 45
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: processor
          image: telemetry/processor:local
          imagePullPolicy: IfNotPresent
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          env:
            - { name: READINGS_TABLE, value: readings }
            - { name: ALERTS_TABLE, value: alerts }
            - { name: VALKEY_URL, value: "redis://valkey:6379/0" }
            - { name: AWS_DEFAULT_REGION, value: us-east-2 }
          # Overlays supply processor-env (queue URLs, endpoints) and aws-credentials.
          envFrom:
            - configMapRef: { name: processor-env }
            - secretRef: { name: aws-credentials }
          ports:
            - { name: health, containerPort: 8080 }
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 30
          readinessProbe:
            httpGet: { path: /healthz, port: health }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - { name: sensors, mountPath: /etc/telemetry/sensors.yaml, subPath: sensors.yaml }
      volumes:
        - name: sensors
          configMap: { name: sensors }
---
# KEDA (installed by scripts/kind-up.sh) sizes the processor by queue depth.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: processor
spec:
  scaleTargetRef: { name: processor }
  minReplicaCount: 1
  maxReplicaCount: 5
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # The HPA default waits 300s; a drained queue should release replicas sooner.
          stabilizationWindowSeconds: 60
  triggers:
    - type: aws-sqs-queue
      authenticationRef: { name: aws-credentials }
      metadata:
        queueURLFromEnv: QUEUE_URL
        awsRegion: us-east-2
        # Target messages per replica.
        queueLength: "100"
        # Queue length = ApproximateNumberOfMessages + ApproximateNumberOfMessagesNotVisible.
        scaleOnInFlight: "true"
---
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: aws-credentials
spec:
  secretTargetRef:
    - { parameter: awsAccessKeyID, name: aws-credentials, key: AWS_ACCESS_KEY_ID }
    - { parameter: awsSecretAccessKey, name: aws-credentials, key: AWS_SECRET_ACCESS_KEY }
