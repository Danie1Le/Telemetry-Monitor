# Rule state store (#8). Both overlays run it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  selector:
    matchLabels: { app: valkey }
  template:
    metadata:
      labels: { app: valkey }
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.0.2
          imagePullPolicy: IfNotPresent
          ports:
            - { name: valkey, containerPort: 6379 }
          livenessProbe:
            tcpSocket: { port: valkey }
          readinessProbe:
            exec: { command: [valkey-cli, ping] }
          resources:
            requests: { cpu: 50m, memory: 32Mi }
            limits: { cpu: 250m, memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: valkey
spec:
  selector: { app: valkey }
  ports:
    - { name: valkey, port: 6379, targetPort: valkey }
