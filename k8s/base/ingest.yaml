apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
spec:
  selector:
    matchLabels: { app: ingest }
  template:
    metadata:
      labels: { app: ingest }
    spec:
      containers:
        - name: ingest
          image: telemetry/ingest:local
          imagePullPolicy: IfNotPresent
          # Overlays supply ingest-env (queue URL, endpoints) and aws-credentials.
          envFrom:
            - configMapRef: { name: ingest-env }
            - secretRef: { name: aws-credentials }
          ports:
            - { name: http, containerPort: 8080 }
          # The JVM can take a minute to start on a busy node; liveness only counts after this passes.
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: http }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: http }
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          volumeMounts:
            - { name: sensors, mountPath: /etc/telemetry/sensors.yaml, subPath: sensors.yaml }
      volumes:
        - name: sensors
          configMap: { name: sensors }
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
spec:
  selector: { app: ingest }
  ports:
    - { name: http, port: 8080, targetPort: http }
