# Envoy Gateway and the Gateway API CRDs are installed by scripts/kind-up.sh.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: envoy
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
# kind has no load balancer: pin a NodePort that k8s/kind.yaml maps to the host.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: EnvoyProxy
metadata:
  name: nodeport
spec:
  provider:
    type: Kubernetes
    kubernetes:
      envoyDeployment:
        container:
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      envoyService:
        type: NodePort
        patch:
          type: StrategicMerge
          value:
            spec:
              ports:
                - { port: 80, nodePort: 30080 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: telemetry
spec:
  gatewayClassName: envoy
  infrastructure:
    parametersRef:
      group: gateway.envoyproxy.io
      kind: EnvoyProxy
      name: nodeport
  listeners:
    - { name: http, protocol: HTTP, port: 80 }
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ingest
spec:
  parentRefs:
    - name: telemetry
  rules:
    - backendRefs:
        - { name: ingest, port: 8080 }
