spring.threads.virtual.enabled=true
telemetry.sensors-config=../sensors.yaml
telemetry.contracts-dir=../contracts
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.mapper.allow-coercion-of-scalars=false
spring.jackson.deserialization.accept-float-as-int=false
telemetry.queue-url=http://localhost:9324/000000000000/telemetry-readings
telemetry.sqs-endpoint=http://localhost:9324
telemetry.aws-region=us-east-2
telemetry.alerts-table=alerts
telemetry.dynamodb-endpoint=http://localhost:8000
# No default: ingest refuses to start without a key.
telemetry.api-key=${INGEST_API_KEY:}
