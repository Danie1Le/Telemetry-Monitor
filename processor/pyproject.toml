[project]
name = "processor"
version = "0.1.0"
description = "Telemetry Monitor processor"
authors = [
    { name = "Danie1Le", email = "157658847+Danie1Le@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "boto3>=1.43.126",
    "jsonschema>=4.26.0",
    "pyyaml>=6.0.3",
    "redis>=8.1.0",
    "referencing>=0.37.0",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "testcontainers>=4.15.0",
]

[tool.pytest.ini_options]
markers = ["integration: needs Docker (Testcontainers)"]
