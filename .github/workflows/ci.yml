name: ci

on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [simulator, processor]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-dependency-glob: ${{ matrix.service }}/uv.lock
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pytest -m "not integration" --cov=${{ matrix.service }} --cov-fail-under=70
      - name: Rules coverage gate
        if: matrix.service == 'processor'
        run: uv run coverage report --include=*/rules.py --fail-under=90
      - name: Integration tests
        if: github.event_name == 'pull_request' && matrix.service == 'processor'
        run: uv run pytest -m integration

  java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: "25"
      - uses: gradle/actions/setup-gradle@v6.4.1
      - run: ./gradlew spotlessCheck test jacocoTestCoverageVerification
      - if: github.event_name == 'pull_request'
        run: ./gradlew integrationTest

  images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [simulator, ingest, processor]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max

  e2e:
    # Not on other branch pushes: the PR run covers them; main and manual runs test the combined state.
    if: github.event_name != 'push' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          cache-dependency-glob: simulator/uv.lock
      - uses: helm/kind-action@v1.15.2
        with:
          version: v0.33.0
          install_only: true
      - run: scripts/kind-up.sh
      - run: uv run --project simulator scripts/e2e.py
      - if: failure()
        run: |
          kubectl --context kind-telemetry describe nodes
          kubectl --context kind-telemetry get pods -A
          kubectl --context kind-telemetry -n telemetry get events
          kubectl --context kind-telemetry -n telemetry logs -l 'app in (simulator,ingest,processor)' --all-containers --prefix --tail=100
      - if: always()
        run: scripts/kind-down.sh

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: hashicorp/setup-terraform@v4.0.1
        with:
          terraform_version: 1.17.x
          terraform_wrapper: false
      - run: terraform fmt -check -recursive terraform
      - run: terraform -chdir=terraform/bootstrap init -backend=false -input=false
      - run: terraform -chdir=terraform/bootstrap validate
      - run: terraform -chdir=terraform/main init -backend=false -input=false
      - run: terraform -chdir=terraform/main validate
      - uses: terraform-linters/setup-tflint@v6.3.2
      # The aws ruleset is fetched from GitHub on init; an absolute config path is needed for --recursive.
      - run: tflint --init --config="$PWD/.tflint.hcl"
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: tflint --recursive --config="$PWD/.tflint.hcl"
