include classpath("application.conf")

node-address {
  protocol = http
  host = "*"
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  telemetry-readings-dlq {}
  telemetry-readings {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "telemetry-readings-dlq"
      maxReceiveCount = 3
    }
  }
}
